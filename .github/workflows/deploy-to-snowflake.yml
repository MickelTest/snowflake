name: Deploy to Snowflake

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Write private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > "${{ runner.temp }}/rsa_key.p8"
          chmod 600 "${{ runner.temp }}/rsa_key.p8"

      - name: Run SQL scripts
        env:
          SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT: "${{ secrets.SNOWFLAKE_ACCOUNT }}"
          SNOWFLAKE_CONNECTIONS_DEFAULT_USER: "${{ secrets.SNOWFLAKE_USER }}"
          SNOWFLAKE_CONNECTIONS_DEFAULT_AUTHENTICATOR: "SNOWFLAKE_JWT"
          SNOWFLAKE_CONNECTIONS_DEFAULT_PRIVATE_KEY_FILE: "${{ runner.temp }}/rsa_key.p8"
          SNOWFLAKE_CONNECTIONS_DEFAULT_ROLE: "${{ secrets.SNOWFLAKE_ROLE }}"
          SNOWFLAKE_CONNECTIONS_DEFAULT_WAREHOUSE: "${{ secrets.SNOWFLAKE_WAREHOUSE }}"
          SNOWFLAKE_CONNECTIONS_DEFAULT_DATABASE: "${{ secrets.SNOWFLAKE_DATABASE }}"
        run: |
          for f in $(ls scripts/*.sql | sort); do
            echo "Running $f"
            snow sql --filename "$f"
          done
