# Save in your repo as: .github/workflows/deploy-to-snowflake.yml
# Runs every .sql file in /scripts (alphabetical order) against Snowflake on push to main.
#
# Add these as GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   SNOWFLAKE_ACCOUNT      e.g. myorg-myaccount
#   SNOWFLAKE_USER         a dedicated service user
#   SNOWFLAKE_PRIVATE_KEY  contents of the unencrypted PKCS8 private key (public key set on the user in Snowflake)
#   SNOWFLAKE_ROLE, SNOWFLAKE_WAREHOUSE, SNOWFLAKE_DATABASE

name: Deploy to Snowflake

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Write private key
        run: |
          mkdir -p ~/.snowflake
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8

      - name: Run SQL scripts
        env:
          SNOWFLAKE_CONNECTIONS_DEFAULT_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CONNECTIONS_DEFAULT_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_CONNECTIONS_DEFAULT_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_CONNECTIONS_DEFAULT_PRIVATE_KEY_FILE: ~/.snowflake/rsa_key.p8
          SNOWFLAKE_CONNECTIONS_DEFAULT_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_CONNECTIONS_DEFAULT_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_CONNECTIONS_DEFAULT_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
        run: |
          for f in $(ls scripts/*.sql | sort); do
            echo "Running $f"
            snow sql --filename "$f"
          done
